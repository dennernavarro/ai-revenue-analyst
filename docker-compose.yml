services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - checkpoints:/app/.state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/properties')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  checkpoints:
